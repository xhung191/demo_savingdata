name: saving_data_demo
description: Demo Chapter 15 - Saving Data Locally (Drift + SQLite + Riverpod)
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  drift: ^2.13.1
  sqlite3: ^2.1.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  file_picker: ^8.0.0      # chọn ảnh đại diện (Windows + Android)
  intl: ^0.19.0            # định dạng ngày tháng

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.13.2
  build_runner: ^2.4.0

flutter:
  uses-material-design: true